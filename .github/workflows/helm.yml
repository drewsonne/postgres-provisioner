env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

name: Publish Helm Chart

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types:
      - completed

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo at same commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Extract version from tag
        id: vars
        run: |
          TAG=$(git describe --tags --exact-match 2>/dev/null || git tag --points-at HEAD | head -n1)
          VERSION="${TAG#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Update chart version and appVersion
        run: |
          sed -i "s/^version:.*/version: ${VERSION}/" chart/postgres-provisioner/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" chart/postgres-provisioner/Chart.yaml

      - name: Package chart
        run: |
          helm package chart/postgres-provisioner

      - name: Prepare repo index
        run: |
          mkdir -p .cr-release-packages
          mv *.tgz .cr-release-packages/
          helm repo index .cr-release-packages \
            --url https://drewsonne.github.io/postgres-provisioner

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .cr-release-packages