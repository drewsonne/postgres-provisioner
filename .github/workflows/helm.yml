name: Publish Helm Chart

on:
  push:
    branches: [ main ]
    paths:
      - "chart/**"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # required for gh-pages push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package chart
        run: |
          helm package chart/postgres-provisioner

      - name: Create index.yaml
        run: |
          mkdir -p .cr-release-packages
          mv *.tgz .cr-release-packages/
          helm repo index .cr-release-packages --url https://drewsonne.github.io/postgres-provisioner

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .cr-release-packages