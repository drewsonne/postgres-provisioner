apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-provisioner
  namespace: {{ .Values.namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: postgres-provisioner
rules:
  - apiGroups: ["db.example.com"]
    resources: ["postgresdatabases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: postgres-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: postgres-provisioner
subjects:
  - kind: ServiceAccount
    name: postgres-provisioner
    namespace: {{ .Values.namespace }}