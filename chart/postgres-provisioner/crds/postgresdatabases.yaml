apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: postgresdatabases.pgprovisioner.drewsonne.github.io
spec:
  group: pgprovisioner.drewsonne.github.io
  scope: Namespaced
  names:
    plural: postgresdatabases
    singular: postgresdatabase
    kind: PostgresDatabase
    shortNames:
      - pgdb
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Database
          type: string
          jsonPath: .spec.dbName
        - name: Owner
          type: string
          jsonPath: .spec.owner
        - name: Ready
          type: boolean
          jsonPath: .status.create_fn.ready
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              required: ["dbName", "owner", "secretName"]
              properties:
                dbName:
                  type: string
                  pattern: "^[a-zA-Z_][a-zA-Z0-9_]{0,62}$"
                  maxLength: 63
                owner:
                  type: string
                  pattern: "^[a-zA-Z_][a-zA-Z0-9_]{0,62}$"
                  maxLength: 63
                secretName:
                  type: string
                  maxLength: 253
                host:
                  type: string
                  description: "Override the default PG_HOST for this database. If set, connects to this host instead."
                  maxLength: 253
                superuserSecret:
                  type: object
                  description: "Override the default superuser credentials for this database."
                  required: ["name", "namespace"]
                  properties:
                    name:
                      type: string
                      maxLength: 253
                    namespace:
                      type: string
                      maxLength: 63
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true