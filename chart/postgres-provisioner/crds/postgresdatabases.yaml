apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: postgresdatabases.db.example.com
spec:
  group: db.example.com
  scope: Namespaced
  names:
    plural: postgresdatabases
    singular: postgresdatabase
    kind: PostgresDatabase
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              required: ["dbName", "owner", "secretName"]
              properties:
                dbName:
                  type: string
                owner:
                  type: string
                secretName:
                  type: string